<div class="max-w-7xl mx-auto mb-0 relative z-10">
    <header class="flex justify-between items-center p-4 md:p-6">
        <div class="flex items-center gap-4">
            <button (click)="onBackClick()" class="w-10 h-10 rounded-full bg-white/60 backdrop-blur-xl border border-white/40 shadow-sm flex items-center justify-center hover:bg-white transition-all active:scale-95 text-slate-500 hover:text-zadna-primary">
                <svg class="w-5 h-5 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
            </button>
            <div *ngIf="title || breadcrumbs.length > 0">
                <nav *ngIf="breadcrumbs.length > 0" class="flex text-xs font-medium text-slate-500 gap-2 mb-1">
                    <ng-container *ngFor="let breadcrumb of breadcrumbs; let last = last">
                        <span 
                            [class.cursor-pointer]="breadcrumb.action"
                            [class.hover:text-zadna-primary]="breadcrumb.action"
                            [class.text-zadna-primary]="last"
                            (click)="onBreadcrumbClick(breadcrumb)">
                            {{ breadcrumb.label }}
                        </span>
                        <span *ngIf="!last">•</span>
                    </ng-container>
                </nav>
                <h1 *ngIf="title" class="text-3xl font-bold text-slate-900">{{ title }}</h1>
            </div>
        </div>
        <button 
            (click)="onActionClick()" 
            [disabled]="isActionDisabled"
            class="bg-zadna-primary text-white px-6 py-2.5 rounded-full flex items-center gap-2 font-medium hover:bg-zadna-primaryDark transition-all active:scale-95 shadow-lg shadow-zadna-primary/30 disabled:opacity-50 disabled:cursor-not-allowed">
            <svg *ngIf="actionButtonIcon === 'edit'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            <svg *ngIf="actionButtonIcon === 'save'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            {{ actionButtonLabel }}
        </button>
    </header>
</div>
