<div class="bg-gray-50 p-4" [attr.dir]="isRTL ? 'rtl' : 'ltr'">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-6 py-4">
    <div class="flex flex-col md:flex-row items-center justify-between gap-6">
      
      <!-- Right Side (in RTL) / Left Side (in LTR): Action Icon Button, Title, Badges, and Metadata -->
      <div class="flex items-center gap-4">
        
        <!-- Action Icon Button -->
        <div class="w-10 h-10 bg-teal-500 rounded-xl flex items-center justify-center cursor-pointer hover:bg-teal-600 transition-colors">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>

        <!-- Title and Badges -->
        <div class="flex flex-col gap-2 items-start">
          <!-- Title with Badges -->
          <div class="flex items-center gap-2">
            <h1 class="text-base font-semibold text-gray-900">{{ title }}</h1>
            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-md text-xs font-medium">
              {{ 'VENDOR_DETAIL.STATUS_ACTIVE' | translate }}
            </span>
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-xs font-medium">
              {{ 'VENDOR_DETAIL.STATUS_VERIFIED' | translate }}
            </span>
          </div>
          
          <!-- Metadata Row -->
          <div class="flex items-center gap-4 text-xs text-gray-500">
            <div class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span>{{ category }}</span>
            </div>
            
            <div class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <span>{{ registrationDate }}</span>
            </div>
            
            <div class="flex items-center gap-1" dir="ltr">
              <span class="text-gray-400">#</span>
              <span class="font-medium text-gray-700">{{ vendorId }}</span>
            </div>
          </div>
        </div>
        
      </div>

      <!-- Left Side: Tabs Navigation -->
      <div class="flex items-center gap-1">
        <button
          *ngFor="let tab of tabs"
          (click)="onTabClick(tab.id)"
          [class]="tab.active 
            ? 'px-4 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg' 
            : 'px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-lg'"
        >
          <span class="flex items-center gap-1">
            <span>{{ tab.labelKey | translate }}</span>
            <span *ngIf="tab.count" dir="ltr">({{ tab.count }})</span>
          </span>
        </button>
      </div>
      
    </div>
  </div>
</div>
