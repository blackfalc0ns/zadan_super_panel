<header class="bg-white border-b border-slate-200 px-6 lg:px-8 py-4 flex flex-col lg:flex-row items-center gap-5 transition-all relative z-10 w-full min-h-[72px]">
    <!-- Title & Breadcrumbs -->
    <div class="flex items-center gap-3 relative z-10 w-full lg:w-auto shrink-0">
        <!-- Back Button -->
        <button *ngIf="showBack" type="button" 
                [routerLink]="backUrl" 
                (click)="onBack()"
                class="w-10 h-10 shrink-0 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 flex items-center justify-center text-slate-500 hover:text-slate-900 transition-colors focus:ring-2 focus:ring-slate-200 focus:outline-none"
                title="Go Back">
            <span class="material-symbols-outlined text-[20px] rtl:rotate-180">arrow_back</span>
        </button>

        <div class="min-w-0">
            <nav *ngIf="breadcrumbs.length" class="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 mb-1">
                <ng-container *ngFor="let breadcrumb of breadcrumbs; let last = last">
                    <a *ngIf="breadcrumb.url && !last" [routerLink]="breadcrumb.url" class="hover:text-slate-900 transition-colors">
                        {{ breadcrumb.label | translate }}
                    </a>
                    <span *ngIf="!breadcrumb.url || last" [class.text-slate-900]="last">
                        {{ breadcrumb.label | translate }}
                    </span>
                    <span *ngIf="!last" class="material-symbols-outlined text-[14px] text-slate-300 opacity-70 rtl:rotate-180">chevron_right</span>
                </ng-container>
            </nav>

            <div class="flex items-center gap-2">
                <ng-content select="[title-prefix]"></ng-content>
                <h1 *ngIf="title" class="text-xl font-black text-slate-900 tracking-tight leading-none">
                    {{ title | translate }}
                </h1>
                <ng-content select="[title-extra]"></ng-content>
            </div>
            <p *ngIf="subtitle" class="text-xs font-medium text-slate-500 mt-1">{{ subtitle | translate }}</p>
        </div>
    </div>

    <!-- Controls: Search (grows) → Filters → View Switcher → Add Button -->
    <div *ngIf="showToolbar" class="flex flex-1 flex-wrap lg:flex-nowrap items-center gap-3 w-full lg:w-auto relative z-10">
        
        <!-- Search grows to fill available space -->
        <div class="flex-1 min-w-[180px]">
            <ng-content select="[search]"></ng-content>
        </div>

        <div class="shrink-0">
            <ng-content select="[filters]"></ng-content>
        </div>

        <div class="shrink-0">
            <ng-content select="[view-switcher]"></ng-content>
        </div>

        <div class="shrink-0">
            <ng-content select="[actions]"></ng-content>
        </div>
        
    </div>
</header>
