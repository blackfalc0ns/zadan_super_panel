<div
  class="modal-shell-backdrop fixed inset-0 z-[95] flex items-center justify-center"
  [ngClass]="backdropClass"
  (click)="onBackdropClick($event)">
  <div
    [dir]="dir"
    [class]="panelClasses"
    (click)="$event.stopPropagation()">
    <header [class]="headerClasses">
      <div [class]="headerContentClasses">
        <ng-content select="[header-prefix]"></ng-content>

        <div [class]="titleWrapperClasses">
          <div [class]="titleRowClasses">
            <span *ngIf="icon" class="material-symbols-outlined text-[22px] text-zadna-primary">{{ icon }}</span>
            <h2 class="min-w-0" [ngClass]="titleClass">
              {{ shouldTranslate ? (title | translate) : title }}
            </h2>
          </div>

          <p *ngIf="subtitle" class="mt-1" [ngClass]="subtitleClass">
            {{ shouldTranslate ? (subtitle | translate) : subtitle }}
          </p>

          <ng-content select="[header-meta]"></ng-content>
        </div>
      </div>

      <div class="flex shrink-0 items-center gap-2">
        <ng-content select="[header-actions]"></ng-content>

        <button [class]="closeButtonClass" type="button" (click)="close.emit()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </header>

    <div [class]="bodyClasses">
      <ng-content select="[modal-body]"></ng-content>
    </div>

    <footer *ngIf="showFooter" [class]="footerClasses">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>
  </div>
</div>
