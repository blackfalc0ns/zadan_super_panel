<section class="rounded-[2rem] border border-slate-200/70 bg-white/80 p-6 shadow-sm h-fit flex flex-col">
  <div class="mb-5">
    <p class="text-[10px] font-black uppercase tracking-[0.18em] text-zadna-primary">{{ 'EMAIL_CENTER.WORKFLOWS.BADGE' | translate }}</p>
    <h2 class="mt-2 text-lg font-black text-slate-900">{{ 'EMAIL_CENTER.WORKFLOWS.TITLE' | translate }}</h2>
    <p class="text-xs font-bold text-slate-400 mt-1">{{ 'EMAIL_CENTER.WORKFLOWS.DESC' | translate }}</p>
  </div>

  <div *ngIf="rules.length === 0" class="rounded-[1.6rem] border border-dashed border-slate-300 bg-slate-50/70 px-5 py-10 text-center flex-1 flex flex-col justify-center items-center">
    <div class="flex h-14 w-14 items-center justify-center rounded-3xl bg-white text-slate-400 shadow-sm">
      <span class="material-symbols-outlined text-[26px]">mail_off</span>
    </div>
    <h3 class="mt-4 text-sm font-black text-slate-900">{{ 'EMAIL_CENTER.EMPTY.TITLE' | translate }}</h3>
    <p class="mt-2 text-xs font-bold text-slate-400 max-w-xs">{{ 'EMAIL_CENTER.EMPTY.MESSAGE' | translate }}</p>
  </div>

  <div *ngIf="rules.length > 0" class="space-y-3 overflow-y-auto max-h-[50rem] pr-1">
    <button
      *ngFor="let rule of rules"
      type="button"
      class="w-full rounded-[1.6rem] border px-4 py-4 text-start transition-all outline-none focus:outline-none"
      [ngClass]="rule.id === selectedRuleId
        ? 'border-zadna-primary/25 bg-zadna-primary/[0.05] shadow-sm'
        : 'border-slate-200 bg-slate-50/70 hover:border-zadna-primary/20 hover:bg-white'"
      (click)="selectRule(rule.id)">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0 flex-1">
          <p class="text-sm font-black text-slate-900 truncate">{{ rule.titleKey | translate }}</p>
          <p class="mt-1 text-[11px] font-bold text-slate-400 truncate">{{ rule.subtitleKey | translate }}</p>
        </div>
        <app-status-pill
          [label]="rule.enabled ? 'EMAIL_CENTER.WORKFLOWS.ENABLED' : 'EMAIL_CENTER.WORKFLOWS.DISABLED'"
          [variant]="rule.enabled ? 'success' : 'neutral'"
          size="sm"
          class="flex-shrink-0">
        </app-status-pill>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <app-status-pill [label]="rule.categoryKey" variant="info" size="sm"></app-status-pill>
        <app-status-pill [label]="rule.cadenceLabelKey" variant="warning" size="sm"></app-status-pill>
        <app-status-pill [label]="getPanelLabelKey(rule.panelScope)" variant="neutral" size="sm"></app-status-pill>
        <app-status-pill
          [label]="rule.automationState === 'live' ? 'EMAIL_CENTER.AUTOMATION.LIVE' : 'EMAIL_CENTER.AUTOMATION.MANUAL_ONLY'"
          [variant]="getAutomationVariant(rule.automationState)"
          size="sm">
        </app-status-pill>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-3">
        <app-status-pill
          [label]="getLastDispatchLabelKey(rule)"
          [variant]="rule.lastDispatch ? getDispatchStatusVariant(rule.lastDispatch.status) : 'neutral'"
          size="sm">
        </app-status-pill>
        <span *ngIf="rule.lastDispatch" class="text-[10px] font-black text-slate-400">
          {{ rule.lastDispatch.createdAtUtc | date:'medium' }}
        </span>
      </div>
    </button>
  </div>
</section>
