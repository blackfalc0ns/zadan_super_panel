<div class="hub-page" [dir]="'SIDEBAR.DIR' | translate">
  <app-page-header
    [title]="'EMAIL_CENTER.TITLE'"
    [subtitle]="'EMAIL_CENTER.DESC'"
    [showToolbar]="true"
    [breadcrumbs]="[
      { label: 'SIDEBAR.HOME', url: '/dashboard' },
      { label: 'SIDEBAR.EMAIL_CENTER' }
    ]">
    <span title-prefix class="material-symbols-outlined text-[28px] text-zadna-primary">mail</span>

    <div actions class="hub-actions">
      <button type="button" class="hub-action-btn" (click)="openSenderProfiles()">
        <span class="material-symbols-outlined">alternate_email</span>
        {{ 'EMAIL_CENTER.NAV.SENDER_PROFILES' | translate }}
      </button>
      <button type="button" class="hub-action-btn" (click)="openHistory()">
        <span class="material-symbols-outlined">history</span>
        {{ 'EMAIL_CENTER.NAV.HISTORY' | translate }}
      </button>
      <button type="button" class="hub-action-btn" (click)="openAccessDirectory()">
        <span class="material-symbols-outlined">shield_person</span>
        {{ 'EMAIL_CENTER.OPEN_ADMIN_USERS' | translate }}
      </button>
    </div>
  </app-page-header>

  <div class="hub-content">
    <app-kpi-cards [cards]="kpiCards"></app-kpi-cards>

    <section *ngIf="pageError && !isLoading" class="hub-error">
      {{ pageError }}
    </section>

    <section *ngIf="!isLoading" class="hub-panel">
      <div class="hub-panel__header">
        <div>
          <p class="hub-eyebrow">{{ 'EMAIL_CENTER.AUDIENCE.BADGE' | translate }}</p>
          <h2>{{ 'EMAIL_CENTER.AUDIENCE.TITLE' | translate }}</h2>
          <p>{{ 'EMAIL_CENTER.AUDIENCE.DESC' | translate }}</p>
        </div>

        <div class="audience-tabs">
          <button
            *ngFor="let audience of audienceTabs"
            type="button"
            class="audience-tab"
            [class.is-active]="selectedAudience === audience.value"
            (click)="setAudience(audience.value)">
            {{ audience.labelKey | translate }}
          </button>
        </div>
      </div>
    </section>

    <div *ngIf="isLoading" class="admin-skeleton-detail">
      <div class="admin-skeleton-detail-grid">
        <div *ngFor="let item of [1,2,3,4,5,6]" class="admin-skeleton-card space-y-3">
          <span class="admin-skeleton admin-skeleton-line sm w-1/3"></span>
          <span class="admin-skeleton admin-skeleton-line lg w-4/5"></span>
          <span class="admin-skeleton admin-skeleton-line w-2/3"></span>
        </div>
      </div>
    </div>

    <app-email-rules-list
      *ngIf="!isLoading"
      [rules]="filteredRules"
      [mode]="'grid'">
    </app-email-rules-list>
  </div>

  <app-email-sender-profiles-modal
    [open]="showSenderProfilesModal"
    [senderProfiles]="senderProfiles"
    (closed)="closeSenderProfiles()">
  </app-email-sender-profiles-modal>
</div>
