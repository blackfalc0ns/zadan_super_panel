<div class="h-full flex flex-col bg-slate-50/50 font-sans pb-10 overflow-y-auto" [dir]="'SIDEBAR.DIR' | translate">
  <app-page-header
    [title]="'EMAIL_CENTER.TITLE'"
    [subtitle]="'EMAIL_CENTER.DESC'"
    [showToolbar]="true"
    [breadcrumbs]="[
      { label: 'SIDEBAR.HOME', url: '/dashboard' },
      { label: 'SIDEBAR.EMAIL_CENTER' }
    ]">
    <span title-prefix class="material-symbols-outlined text-[28px] text-zadna-primary">mail</span>

    <div actions class="flex items-center gap-3 animate-in slide-in-from-left-10 duration-700">
      <button
        type="button"
        class="px-5 py-3 bg-white text-slate-500 border border-slate-200 rounded-[1.2rem] text-sm font-black flex items-center gap-2 hover:bg-slate-50 transition-all hover:text-zadna-primary focus:outline-none"
        (click)="openAccessDirectory()">
        <span class="material-symbols-outlined text-[20px]">shield_person</span>
        {{ 'EMAIL_CENTER.OPEN_ADMIN_USERS' | translate }}
      </button>
    </div>
  </app-page-header>

  <div class="flex-1 min-h-0 px-4 md:px-10 py-4 max-w-[120rem] mx-auto w-full space-y-6 animate-in slide-in-from-bottom-10 duration-700">
    <app-kpi-cards [cards]="kpiCards"></app-kpi-cards>

    <!-- Error state banner -->
    <section *ngIf="pageError && !isLoading" class="rounded-[1.6rem] border border-red-200 bg-red-50 px-5 py-4 text-sm font-bold text-red-600">
      {{ pageError }}
    </section>

    <!-- Collapsible Sender Profiles -->
    <app-email-sender-profiles
      *ngIf="!isLoading && senderProfiles.length > 0"
      [senderProfiles]="senderProfiles">
    </app-email-sender-profiles>

    <!-- Audience Selection Tabs -->
    <section *ngIf="!isLoading" class="rounded-[2rem] border border-slate-200/70 bg-white/80 p-6 shadow-sm">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
        <div>
          <p class="text-[10px] font-black uppercase tracking-[0.18em] text-zadna-primary">{{ 'EMAIL_CENTER.AUDIENCE.BADGE' | translate }}</p>
          <h2 class="mt-2 text-lg font-black text-slate-900">{{ 'EMAIL_CENTER.AUDIENCE.TITLE' | translate }}</h2>
          <p class="text-xs font-bold text-slate-400">{{ 'EMAIL_CENTER.AUDIENCE.DESC' | translate }}</p>
        </div>

        <div class="flex flex-wrap gap-2">
          <button
            *ngFor="let audience of audienceTabs"
            type="button"
            class="rounded-full px-4 py-2.5 text-xs font-black transition-all focus:outline-none"
            [ngClass]="selectedAudience === audience.value
              ? 'bg-zadna-primary text-white shadow-lg shadow-zadna-primary/15'
              : 'bg-slate-100 text-slate-500 hover:bg-slate-200/80'"
            (click)="setAudience(audience.value)">
            {{ audience.labelKey | translate }}
          </button>
        </div>
      </div>
    </section>

    <!-- Skeleton Loaders -->
    <div *ngIf="isLoading" class="admin-skeleton-detail">
      <div class="admin-skeleton-detail-hero">
        <div class="space-y-3">
          <span class="admin-skeleton admin-skeleton-line sm w-1/4"></span>
          <span class="admin-skeleton admin-skeleton-line lg w-1/2"></span>
          <span class="admin-skeleton admin-skeleton-line w-2/3"></span>
        </div>
        <span class="admin-skeleton admin-skeleton-avatar"></span>
      </div>
      <div class="admin-skeleton-detail-grid">
        <div *ngFor="let item of [1,2,3,4]" class="admin-skeleton-card space-y-3">
          <span class="admin-skeleton admin-skeleton-line sm w-1/3"></span>
          <span class="admin-skeleton admin-skeleton-line lg w-4/5"></span>
          <span class="admin-skeleton admin-skeleton-line w-2/3"></span>
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div *ngIf="!isLoading" class="workspace-shell">
      <aside class="workspace-sidebar">
        <app-email-rules-list
          [rules]="filteredRules"
          [selectedRuleId]="selectedRuleId"
          (ruleSelected)="selectRule($event)">
        </app-email-rules-list>
      </aside>

      <section class="workspace-main">
        <app-email-rule-config
          *ngIf="selectedRule"
          [rule]="selectedRule"
          [senderProfiles]="senderProfiles"
          [vendorOptions]="vendorOptions"
          [branchDirectory]="branchDirectory"
          [resolvedRecipients]="resolvedRecipients"
          [lastTestSendResult]="lastTestSendResult"
          [canEdit]="canEdit"
          [isSaving]="isSaving"
          [isTestingSend]="isTestingSend"
          [isResolvingRecipients]="isResolvingRecipients"
          [dispatches]="dispatches"
          [rules]="rules"
          [isHistoryLoading]="isHistoryLoading"
          [historyFilters]="historyFilters"
          (save)="saveSelectedRule()"
          (testSend)="testSendSelectedRule()"
          (draftChange)="onRuleDraftChanged()"
          (vendorChange)="onVendorChange($event)"
          (branchScopeModeChange)="onBranchScopeModeChange($event)"
          (historyFiltersChange)="onHistoryFiltersChange($event)"
          (clearHistoryFilters)="clearHistoryFilters()">
        </app-email-rule-config>

        <div *ngIf="!selectedRule" class="workspace-empty">
          <span class="material-symbols-outlined text-[42px] text-slate-300">drafts</span>
          <h3>{{ 'EMAIL_CENTER.EMPTY.TITLE' | translate }}</h3>
          <p>{{ 'EMAIL_CENTER.EMPTY.MESSAGE' | translate }}</p>
        </div>
      </section>
    </div>
  </div>
</div>
