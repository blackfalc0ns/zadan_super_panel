<article class="dashboard-panel max-h-[18rem]">
  <div class="dashboard-panel-header">
    <h2 class="text-[12px] font-bold text-slate-800 flex items-center gap-2">
      <span class="material-symbols-outlined text-slate-400 text-[14px]">history</span>
      {{ 'DASHBOARD.AUDIT_FEED.TITLE' | translate }}
    </h2>
  </div>
  <div class="flex-1 overflow-y-auto p-4">
    <div *ngIf="auditItems.length === 0" class="py-6 flex flex-col items-center justify-center text-slate-300">
      <span class="material-symbols-outlined text-2xl mb-1">history_toggle_off</span>
      <p class="text-[10px] font-medium">{{ 'DASHBOARD.AUDIT_FEED.EMPTY' | translate }}</p>
    </div>
    <div class="space-y-3 relative" [ngClass]="isRTL ? 'pr-4 border-r-2 border-slate-100' : 'pl-4 border-l-2 border-slate-100'">
      <div *ngFor="let audit of auditItems | slice:0:15" class="relative flex items-start gap-3">
        <div class="absolute top-1 flex items-center justify-center w-3 h-3 rounded-full bg-white border-2 border-slate-200 z-10"
             [ngClass]="isRTL ? '-right-[22px]' : '-left-[22px]'">
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-0.5">
            <span class="text-[9px] font-medium text-slate-400" [attr.dir]="'ltr'">{{ formatRelativeTime(audit.timestampUtc) }}</span>
            <h4 class="text-[10px] font-bold text-slate-700">{{ audit.titleKey | translate:audit.titleParams }}</h4>
          </div>
          <p class="text-[9px] text-slate-400">{{ audit.subtitleKey | translate:audit.subtitleParams }}</p>
        </div>
      </div>
    </div>
  </div>
</article>
