<div class="w-full shrink-0 px-5 pt-4 lg:px-10 lg:pt-5 overflow-visible bg-slate-50/80">
  <header class="dashboard-header-shell premium-glass-light rounded-[2rem] px-6 py-4 shadow-[0_20px_40px_-20px_rgba(15,23,42,0.06),0_1px_3px_0_rgba(15,23,42,0.02)] flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5 relative z-10 w-full max-w-[1600px] mx-auto transition-all overflow-visible">
    <!-- Ambient Inner Aurora Glow Effects for Premium look -->
    <div class="absolute -right-20 -top-20 w-44 h-44 rounded-full bg-zadna-primary/[0.03] blur-3xl pointer-events-none z-0"></div>
    <div class="absolute -left-20 -bottom-20 w-44 h-44 rounded-full bg-emerald-500/[0.02] blur-3xl pointer-events-none z-0"></div>

    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between w-full relative z-10">
      <div class="dashboard-live-pill" [class.is-offline]="dashboard.systemMode !== 'live'">
        <span class="relative flex h-2.5 w-2.5">
          <span *ngIf="dashboard.systemMode === 'live'" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-2.5 w-2.5 rounded-full ring-2 ring-white transition-all duration-300" [ngClass]="dashboard.systemMode === 'live' ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]' : 'bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.6)]'"></span>
        </span>
        <div class="min-w-0">
          <p class="text-[12px] font-black leading-none text-slate-800 tracking-tight">{{ dashboard.systemStatusLabelKey | translate }}</p>
          <span class="mt-1.5 flex items-center gap-1 text-[10px] font-bold text-slate-400">
            <span class="material-symbols-outlined text-[13px]">schedule</span>
            {{ dashboard.lastUpdatedLabel }}
          </span>
        </div>
      </div>

      <div class="dashboard-filter-bar">
        <button type="button" class="dashboard-refresh-button" (click)="refreshRequested.emit()" [title]="'COMMON.REFRESH' | translate">
          <span class="material-symbols-outlined text-[17px]">refresh</span>
        </button>
        <div class="dashboard-filter-field relative">
          <app-searchable-select [ngModel]="filterState.vendorId" [searchable]="true" (ngModelChange)="onVendorChange($event)" [options]="vendorOptions" [placeholder]="'DASHBOARD.FILTERS.VENDOR' | translate" [dropdownPanelClass]="'min-w-72'" class="dashboard-header-select block w-60 text-[10px] font-semibold"></app-searchable-select>
        </div>
        <div class="dashboard-filter-field relative">
          <app-searchable-select [ngModel]="filterState.region" [searchable]="true" (ngModelChange)="onRegionChange($event)" [options]="regionOptions" [placeholder]="'DASHBOARD.FILTERS.REGION' | translate" [dropdownPanelClass]="'min-w-56'" class="dashboard-header-select block w-52 text-[10px] font-semibold"></app-searchable-select>
        </div>
        <div class="dashboard-filter-field relative">
          <app-searchable-select [ngModel]="filterState.dateRange" [searchable]="false" (ngModelChange)="onDateRangeChange($event)" [options]="dateRangeOptions" [placeholder]="'DASHBOARD.FILTERS.DATE_RANGE' | translate" [dropdownPanelClass]="'min-w-44'" class="dashboard-header-select block w-32 text-[10px] font-semibold"></app-searchable-select>
        </div>
      </div>
    </div>
  </header>
</div>
