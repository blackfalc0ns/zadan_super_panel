<div class="space-y-6 animate-in slide-in-from-bottom-8 duration-700">
    <app-kpi-cards [cards]="performanceKpis"></app-kpi-cards>

  <div class="grid gap-6 lg:grid-cols-2">
    <!-- Benchmarks -->
    <section class="rounded-[1.5rem] border border-slate-200 bg-white p-6 shadow-sm flex flex-col">
      <app-section-header 
        [title]="'DRIVERS.DETAIL.PERFORMANCE.STATIC.BENCHMARKS_TITLE' | translate" 
        [shouldTranslate]="false" 
        icon="analytics"
        [compact]="true">
      </app-section-header>

      <div class="mt-6 flex-1 space-y-6">
        <div *ngFor="let benchmark of driver.performanceSnapshot.benchmarks" class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-slate-900">{{ benchmark.label | translate }}</span>
            <span class="text-xs font-bold text-slate-500" dir="ltr">{{ benchmark.driverValue }}{{ benchmark.unit }}</span>
          </div>
          <div class="relative h-2.5 w-full rounded-full bg-slate-100 overflow-hidden">
            <!-- Region Average Marker -->
            <div class="absolute top-0 bottom-0 z-10 w-1 bg-slate-400" 
                 [style.left.%]="isRTL ? null : (benchmark.regionValue / 100) * 100"
                 [style.right.%]="isRTL ? (benchmark.regionValue / 100) * 100 : null"
                 title="Region Average">
            </div>
            <!-- Driver Progress -->
            <div class="absolute top-0 bottom-0 rounded-full transition-all duration-1000"
                 [ngClass]="{
                   'bg-emerald-500': benchmark.driverValue >= benchmark.regionValue,
                   'bg-amber-500': benchmark.driverValue < benchmark.regionValue && benchmark.driverValue >= benchmark.regionValue * 0.8,
                   'bg-red-500': benchmark.driverValue < benchmark.regionValue * 0.8,
                   'left-0': !isRTL,
                   'right-0': isRTL
                 }"
                 [style.width.%]="(benchmark.driverValue / Math.max(100, benchmark.regionValue * 1.2)) * 100">
            </div>
          </div>
          <p class="text-[10px] text-slate-400">{{ benchmark.insight | translate }}</p>
        </div>
      </div>
    </section>

    <!-- Insights -->
    <section class="rounded-[1.5rem] border border-slate-200 bg-white p-6 shadow-sm">
      <app-section-header 
        [title]="'DRIVERS.DETAIL.PERFORMANCE.STATIC.INSIGHTS_TITLE' | translate" 
        [shouldTranslate]="false" 
        icon="lightbulb"
        [compact]="true">
      </app-section-header>

      <div class="mt-6 grid gap-4 sm:grid-cols-2">
        <div *ngFor="let group of driver.performanceSnapshot.insightGroups" 
             class="rounded-xl border p-4"
             [ngClass]="{
               'border-emerald-100 bg-emerald-50/50': group.tone === 'success',
               'border-amber-100 bg-amber-50/50': group.tone === 'warning',
               'border-red-100 bg-red-50/50': group.tone === 'danger',
               'border-sky-100 bg-sky-50/50': group.tone === 'primary'
             }">
          <div class="flex items-center gap-2 mb-3"
               [ngClass]="{
                 'text-emerald-700': group.tone === 'success',
                 'text-amber-700': group.tone === 'warning',
                 'text-red-700': group.tone === 'danger',
                 'text-sky-700': group.tone === 'primary'
               }">
            <span class="material-symbols-outlined text-[18px]">{{ group.icon }}</span>
            <h4 class="text-xs font-black">{{ group.title | translate }}</h4>
          </div>
          <ul class="space-y-2">
            <li *ngFor="let item of group.items" class="flex items-start gap-2 text-[11px] font-medium text-slate-600 leading-relaxed">
              <span class="mt-1 h-1 w-1 shrink-0 rounded-full bg-current opacity-40"></span>
              {{ item | translate }}
            </li>
          </ul>
        </div>
      </div>
    </section>
  </div>
</div>
