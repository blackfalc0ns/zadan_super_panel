<section class="font-sans" [attr.dir]="isRTL ? 'rtl' : 'ltr'">
  <!-- Clean Professional Back Link -->
  <div class="mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-8 pt-6 pb-2">
    <button (click)="goBack()" 
      class="group flex items-center gap-2 text-sm font-black text-slate-500 hover:text-slate-900 transition-colors w-fit outline-none focus-visible:ring-2 focus-visible:ring-slate-400 rounded-md">
      <span class="material-symbols-outlined text-[18px] transition-transform duration-300" [ngClass]="isRTL ? 'group-hover:translate-x-1' : 'group-hover:-translate-x-1'">{{ isRTL ? 'arrow_forward' : 'arrow_back' }}</span>
      <span>{{ 'COMMON.BACK_TO_LIST' | translate }}</span>
    </button>
  </div>

  <div *ngIf="error && !isLoading" class="mx-auto max-w-[1600px] px-4 py-6 sm:px-6 lg:px-8">
    <div class="rounded-2xl border border-rose-200 bg-rose-50 px-5 py-4 text-sm font-bold text-rose-700 shadow-sm">
      {{ error }}
    </div>
  </div>

  <app-driver-detail-view
    *ngIf="!error || isLoading"
    [driverDetail]="driver"
    [isLoading]="isLoading"
    [currentTab]="activeTab"
    [quickNote]="quickNote"
    [reviewerDecisionNote]="reviewerDecisionNote"
    [selectedRejectionReason]="selectedRejectionReason"
    [internalReviewNote]="internalReviewNote"
    [previewType]="previewType"
    [selectedTask]="selectedTask"
    [selectedIncident]="selectedIncident"
    [isRTL]="isRTL"
    (tabChange)="setTab($event)"
    (workflowActionRequested)="executeWorkflowAction($event)"
    (openTasksRequested)="setTab('operations')"
    (toggleSuspensionRequested)="toggleSuspension()"
    (quickNoteChange)="quickNote = $event"
    (quickNoteAdded)="addQuickNote()"
    (reviewerDecisionNoteChange)="reviewerDecisionNote = $event"
    (selectedRejectionReasonChange)="selectedRejectionReason = $event"
    (internalReviewNoteChange)="internalReviewNote = $event"
    (reviewActionRequested)="requestReviewAction($event)"
    (taskPreviewRequested)="openTaskPreview($event)"
    (incidentPreviewRequested)="openIncidentPreview($event)"
    (previewClosed)="closePreview()">
  </app-driver-detail-view>
</section>
