<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4 modal-backdrop"
  (click)="onBackdropClick($event)">
  <div
    class="relative z-10 flex w-full max-w-2xl flex-col overflow-hidden rounded-[1.75rem] border border-slate-200 bg-white shadow-2xl"
    [attr.dir]="isRTL ? 'rtl' : 'ltr'"
    (click)="$event.stopPropagation()">

    <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-5">
      <div class="space-y-1">
        <h2 class="text-lg font-black text-slate-900">
          {{ isRTL ? 'تعديل سجل المالك' : 'Edit owner record' }}
        </h2>
        <p class="text-sm font-medium text-slate-500">
          {{ isRTL ? 'تحديث البيانات الرسمية المستخدمة للتواصل والتحقق.' : 'Update the official owner data used for contact and verification.' }}
        </p>
      </div>
      <button
        type="button"
        (click)="onClose()"
        [disabled]="isSaving"
        class="flex h-10 w-10 items-center justify-center rounded-xl text-slate-400 transition-all hover:bg-slate-100 hover:text-slate-600 disabled:cursor-not-allowed disabled:opacity-40">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </header>

    <div class="max-h-[72vh] overflow-y-auto px-6 py-5">
      <fieldset class="space-y-5" [disabled]="isSaving">
        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500">{{ isRTL ? 'اسم المالك' : 'Owner name' }}</label>
            <input
              type="text"
              name="ownerName"
              [(ngModel)]="draftOwnerData.ownerName"
              class="h-11 w-full rounded-xl border border-slate-200 px-4 text-sm font-semibold text-slate-900 outline-none transition-all focus:border-primary focus:ring-4 focus:ring-primary/5">
          </div>

          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500">{{ isRTL ? 'الجنسية' : 'Nationality' }}</label>
            <app-searchable-select
              [(ngModel)]="draftOwnerData.nationality"
              name="nationality"
              [options]="nationalityOptions"
              [placeholder]="isRTL ? 'اختر الجنسية' : 'Select nationality'">
            </app-searchable-select>
          </div>

          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500">{{ isRTL ? 'البريد الإلكتروني' : 'Email' }}</label>
            <input
              type="email"
              dir="ltr"
              name="ownerEmail"
              [(ngModel)]="draftOwnerData.ownerEmail"
              class="h-11 w-full rounded-xl border border-slate-200 px-4 text-left text-sm font-semibold text-slate-900 outline-none transition-all focus:border-primary focus:ring-4 focus:ring-primary/5">
          </div>

          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500">{{ isRTL ? 'رقم الجوال' : 'Phone' }}</label>
            <input
              type="text"
              dir="ltr"
              name="ownerPhone"
              [(ngModel)]="draftOwnerData.ownerPhone"
              class="h-11 w-full rounded-xl border border-slate-200 px-4 text-left text-sm font-semibold text-slate-900 outline-none transition-all focus:border-primary focus:ring-4 focus:ring-primary/5">
          </div>

          <div class="space-y-2 md:col-span-2">
            <label class="text-xs font-bold text-slate-500">{{ isRTL ? 'رقم الهوية' : 'ID number' }}</label>
            <input
              type="text"
              dir="ltr"
              name="idNumber"
              [(ngModel)]="draftOwnerData.idNumber"
              class="h-11 w-full rounded-xl border border-slate-200 px-4 text-left text-sm font-semibold text-slate-900 outline-none transition-all focus:border-primary focus:ring-4 focus:ring-primary/5">
          </div>
        </div>

        <div *ngIf="validationMessage" class="rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-semibold text-amber-700">
          {{ validationMessage }}
        </div>

        <div *ngIf="errorMessage" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">
          {{ errorMessage }}
        </div>
      </fieldset>
    </div>

    <footer class="flex items-center justify-end gap-3 border-t border-slate-200 px-6 py-4">
      <button
        type="button"
        (click)="onClose()"
        [disabled]="isSaving"
        class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-bold text-slate-600 transition-all hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">
        {{ isRTL ? 'إلغاء' : 'Cancel' }}
      </button>
      <button
        type="button"
        (click)="onSave()"
        [disabled]="!isFormValid || isSaving"
        class="rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white transition-all hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-50">
        {{ isSaving ? (isRTL ? 'جاري الحفظ...' : 'Saving...') : (isRTL ? 'حفظ التعديلات' : 'Save changes') }}
      </button>
    </footer>
  </div>
</div>
