<div class="relative overflow-hidden px-4 pt-4 pb-2 sm:px-6 sm:pt-6 lg:px-8" [attr.dir]="isRTL ? 'rtl' : 'ltr'">
  <!-- Executive Header Main Container -->
  <div class="relative overflow-hidden rounded-[2rem] bg-slate-950 p-6 shadow-2xl sm:p-8 mx-auto max-w-[1600px]">
    <!-- Deep glowing background effects -->
    <div class="absolute -right-32 -top-32 h-96 w-96 rounded-full bg-primary/20 blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -left-32 h-96 w-96 rounded-full bg-emerald-500/10 blur-[100px] pointer-events-none"></div>
    <div class="absolute inset-0 bg-[url('/assets/images/noise.png')] opacity-[0.03] mix-blend-overlay pointer-events-none"></div>

    <div class="relative z-10 flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
      
      <!-- Vendor Info Cluster -->
      <div class="flex flex-col sm:flex-row items-center sm:items-start lg:items-center gap-5 w-full lg:w-auto text-center sm:text-start">
        
        <!-- Premium Icon Box -->
        <div class="flex h-16 w-16 md:h-20 md:w-20 shrink-0 items-center justify-center rounded-[1.5rem] border border-white/10 bg-white/5 text-primary shadow-inner backdrop-blur-xl transition-transform duration-500 hover:scale-105 hover:rotate-3 group">
          <span class="material-symbols-outlined text-[32px] md:text-[40px] transition-transform duration-500 group-hover:scale-110">storefront</span>
        </div>

        <!-- Text Details -->
        <div class="flex flex-col items-center sm:items-start gap-2 min-w-0">
          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3 w-full">
            <h1 class="text-xl md:text-2xl font-black text-white tracking-tight leading-tight truncate">{{ title }}</h1>
            
            <div class="flex items-center gap-2 shrink-0">
              <span class="flex items-center gap-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 text-[10px] sm:text-[11px] font-black tracking-widest text-emerald-400 backdrop-blur-sm">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                {{ statusLabelKey | translate | uppercase }}
              </span>
              <span class="flex items-center gap-1 rounded-full border border-blue-400/30 bg-blue-400/10 px-2.5 py-1 text-[10px] sm:text-[11px] font-black tracking-widest text-blue-400 backdrop-blur-sm">
                <span class="material-symbols-outlined text-[14px]">verified</span>
                {{ verificationLabelKey | translate | uppercase }}
              </span>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3 sm:gap-4 mt-1">
            <div class="flex items-center gap-1.5 rounded-xl border border-white/10 bg-white/5 px-3 py-1.5 text-[11px] sm:text-xs font-bold text-slate-300 backdrop-blur-md transition-colors hover:bg-white/10 hover:text-white">
              <span class="material-symbols-outlined text-[16px] text-primary">tag</span>
              <span class="font-mono tracking-wider">{{ vendorId }}</span>
            </div>
            <div class="flex items-center gap-1.5 text-[11px] sm:text-xs font-bold text-slate-400">
              <span class="material-symbols-outlined text-[16px]">calendar_today</span>
              <span>{{ registrationDate }}</span>
            </div>
            <div class="flex items-center gap-1.5 text-[11px] sm:text-xs font-bold text-slate-400">
              <span class="material-symbols-outlined text-[16px]">location_on</span>
              <span>{{ category }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Actions Array -->
      <div class="flex flex-wrap items-center justify-center sm:justify-end gap-2 w-full lg:w-auto shrink-0">
        <!-- Test Notification -->
        <button
          (click)="sendTestNotification()"
          type="button"
          [disabled]="isSendingTestNotification || !vendorId"
          class="group flex h-11 items-center gap-2 rounded-[1rem] border border-white/10 bg-white/5 px-4 text-xs font-black text-slate-300 backdrop-blur-md transition-all hover:bg-white/10 hover:text-white disabled:opacity-50 disabled:cursor-not-allowed">
          <span class="material-symbols-outlined text-[18px] group-hover:text-amber-400 transition-colors" [class.animate-spin]="isSendingTestNotification">
            {{ isSendingTestNotification ? 'progress_activity' : 'notifications_active' }}
          </span>
          <span class="hidden sm:inline">{{ isSendingTestNotification ? sendingTestNotificationLabel : sendTestNotificationLabel }}</span>
        </button>

        <!-- Access Directory -->
        <button
          (click)="openAccessDirectory()"
          type="button"
          class="group flex h-11 items-center gap-2 rounded-[1rem] border border-white/10 bg-white/5 px-4 text-xs font-black text-slate-300 backdrop-blur-md transition-all hover:bg-white/10 hover:text-white">
          <span class="material-symbols-outlined text-[18px] group-hover:text-primary transition-colors">shield_person</span>
          <span class="hidden sm:inline">{{ 'VENDOR_DETAIL.OPEN_ACCESS_DIRECTORY' | translate }}</span>
        </button>

        <!-- Email Routing -->
        <button
          (click)="openEmailRouting()"
          type="button"
          class="group flex h-11 items-center gap-2 rounded-[1rem] border border-white/10 bg-white/5 px-4 text-xs font-black text-slate-300 backdrop-blur-md transition-all hover:bg-white/10 hover:text-white">
          <span class="material-symbols-outlined text-[18px] group-hover:text-emerald-400 transition-colors">mail</span>
          <span class="hidden sm:inline">{{ 'VENDOR_DETAIL.OPEN_EMAIL_ROUTING' | translate }}</span>
        </button>

        <div class="h-6 w-px bg-white/10 mx-1 hidden sm:block"></div>

        <!-- Quick Contact -->
        <button
          (click)="onQuickContact()"
          type="button"
          class="group flex h-11 items-center gap-2 rounded-[1rem] bg-primary px-5 text-xs font-black text-white shadow-lg shadow-primary/20 transition-all hover:-translate-y-0.5 hover:shadow-xl hover:shadow-primary/30">
          <span class="material-symbols-outlined text-[18px] transition-transform group-hover:scale-110 group-hover:-rotate-12">chat</span>
          <span>{{ 'VENDOR_DETAIL.QUICK_CONTACT_FULL' | translate }}</span>
        </button>
      </div>
    </div>

    <!-- Multi-Tab Navigation (Integrated deeply into the dark header) -->
    <div class="mt-8 border-t border-white/10 pt-4 relative z-20">
      <app-detail-tabs-nav
        class="block w-full"
        [tabs]="navTabs"
        [activeTab]="activeTab"
        (tabChange)="onTabClick($event)">
      </app-detail-tabs-nav>
    </div>

  </div>
</div>
