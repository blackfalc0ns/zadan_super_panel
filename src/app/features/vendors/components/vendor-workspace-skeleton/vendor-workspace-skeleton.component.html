<div class="vendor-workspace-skeleton mx-auto max-w-[1520px] space-y-5 px-4 py-5 pb-6 md:px-6 lg:px-8" aria-hidden="true">
  <div *ngIf="includeHero" class="admin-skeleton-card rounded-[1.5rem] p-5 md:p-6">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
      <div class="min-w-0 flex-1 space-y-3">
        <span class="admin-skeleton admin-skeleton-chip !w-28"></span>
        <span class="admin-skeleton admin-skeleton-line lg block w-2/5 max-w-xs"></span>
        <span class="admin-skeleton admin-skeleton-line sm block w-3/5 max-w-md"></span>
        <div class="flex flex-wrap gap-2 pt-1">
          <span class="admin-skeleton admin-skeleton-chip !w-20"></span>
          <span class="admin-skeleton admin-skeleton-chip !w-24"></span>
        </div>
      </div>
    </div>
    <div class="mt-5 grid gap-2.5 sm:grid-cols-2 lg:grid-cols-4">
      <div *ngFor="let i of [1,2,3,4]" class="rounded-xl border border-slate-100 bg-slate-50/80 p-3.5 space-y-2">
        <span class="admin-skeleton admin-skeleton-line sm block w-1/2"></span>
        <span class="admin-skeleton admin-skeleton-line lg block w-2/3"></span>
      </div>
    </div>
  </div>

  <ng-container [ngSwitch]="variant">
    <div *ngSwitchCase="'table'" class="admin-skeleton-table rounded-[1.5rem] p-4" style="--skeleton-columns: 6">
      <div class="admin-skeleton-table-header">
        <span *ngFor="let c of [1,2,3,4,5,6]" class="admin-skeleton admin-skeleton-line sm"></span>
      </div>
      <div *ngFor="let r of [1,2,3,4,5,6,7]" class="admin-skeleton-table-row">
        <span class="admin-skeleton admin-skeleton-avatar"></span>
        <span class="admin-skeleton admin-skeleton-line lg w-4/5"></span>
        <span class="admin-skeleton admin-skeleton-line sm"></span>
        <span class="admin-skeleton admin-skeleton-line sm"></span>
        <span class="admin-skeleton admin-skeleton-chip"></span>
        <span class="admin-skeleton admin-skeleton-chip"></span>
      </div>
    </div>

    <div *ngSwitchCase="'split'" class="grid gap-5 xl:grid-cols-[minmax(300px,360px)_minmax(0,1fr)]">
      <div class="admin-skeleton-card space-y-3 p-4">
        <span *ngFor="let i of [1,2,3,4,5,6]" class="admin-skeleton admin-skeleton-line lg block w-full"></span>
      </div>
      <div class="admin-skeleton-card min-h-[22rem] p-4">
        <span class="admin-skeleton admin-skeleton-media !min-h-[18rem] rounded-xl"></span>
      </div>
    </div>

    <div *ngSwitchDefault class="grid gap-5 xl:grid-cols-12">
      <div class="space-y-5 xl:col-span-8">
        <div class="admin-skeleton-card min-h-[12rem] p-5 space-y-4">
          <span class="admin-skeleton admin-skeleton-line lg block w-1/3"></span>
          <span class="admin-skeleton admin-skeleton-line sm block w-full"></span>
          <span class="admin-skeleton admin-skeleton-line sm block w-5/6"></span>
          <div class="grid gap-3 sm:grid-cols-2 pt-2">
            <span class="admin-skeleton admin-skeleton-media !h-20 rounded-xl"></span>
            <span class="admin-skeleton admin-skeleton-media !h-20 rounded-xl"></span>
          </div>
        </div>
        <div class="admin-skeleton-card min-h-[10rem] p-5 space-y-3">
          <span class="admin-skeleton admin-skeleton-line lg block w-1/4"></span>
          <span *ngFor="let i of [1,2,3]" class="admin-skeleton admin-skeleton-line sm block w-full"></span>
        </div>
      </div>
      <aside class="space-y-5 xl:col-span-4">
        <div class="admin-skeleton-card min-h-[14rem] p-4 space-y-3">
          <span *ngFor="let i of [1,2,3,4]" class="admin-skeleton admin-skeleton-line lg block w-full"></span>
        </div>
        <div class="admin-skeleton-card min-h-[10rem] p-4 space-y-3">
          <span *ngFor="let i of [1,2,3]" class="admin-skeleton admin-skeleton-line sm block w-full"></span>
        </div>
      </aside>
    </div>
  </ng-container>
</div>
