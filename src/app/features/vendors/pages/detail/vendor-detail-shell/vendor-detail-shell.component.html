<section class="vendor-brand-scope">
  <app-vendor-detail-header [activeTab]="activeTab">
  </app-vendor-detail-header>

  @if (workspaceLoadError && !isWorkspaceLoading) {
    <div class="mx-auto max-w-[1520px] px-4 py-8 md:px-6 lg:px-8">
      <div class="rounded-2xl border border-rose-200 bg-rose-50 px-5 py-4 text-sm font-semibold text-rose-800">
        {{ workspaceLoadError }}
      </div>
    </div>
  } @else if (isWorkspaceLoading) {
    <app-vendor-workspace-skeleton
      [includeHero]="false"
      [variant]="skeletonVariant">
    </app-vendor-workspace-skeleton>
  } @else {
    <router-outlet></router-outlet>
  }
</section>
