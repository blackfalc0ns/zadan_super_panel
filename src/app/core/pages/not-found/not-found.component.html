<div
  class="relative w-full overflow-hidden"
  [ngClass]="embedded ? 'flex min-h-[calc(100vh-11rem)] items-center justify-center px-4 py-10' : 'min-h-screen flex items-center justify-center bg-zadna-bgLight px-6 py-16'">

  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-16 start-0 h-56 w-56 rounded-full bg-zadna-primary/10 blur-3xl"></div>
    <div class="absolute bottom-0 end-0 h-64 w-64 rounded-full bg-zadna-accent/10 blur-3xl"></div>
    <div class="absolute inset-0 bg-[linear-gradient(rgba(18,124,140,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(18,124,140,0.04)_1px,transparent_1px)] bg-[size:28px_28px] [mask-image:radial-gradient(circle_at_center,black,transparent_78%)]"></div>
  </div>

  <div class="relative z-10 w-full max-w-2xl rounded-[2rem] border border-white/80 bg-white/90 p-8 text-center shadow-[0_30px_60px_-15px_rgba(18,124,140,0.15)] backdrop-blur-xl sm:p-10">
    <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-[1.5rem] bg-zadna-primary/10">
      <svg class="h-10 w-10 text-zadna-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M9.172 16.172a4 4 0 015.656 0M15 10h.01M9 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <p class="bg-gradient-to-br from-zadna-primary via-zadna-primaryDark to-zadna-accent bg-clip-text text-7xl font-black leading-none tracking-tight text-transparent sm:text-8xl">
      404
    </p>

    <h1 class="mt-4 text-2xl font-black text-zadna-bgDark sm:text-3xl">
      {{ 'NOT_FOUND.TITLE' | translate }}
    </h1>

    <p class="mx-auto mt-3 max-w-lg text-sm leading-relaxed text-gray-500 sm:text-base">
      {{ 'NOT_FOUND.MESSAGE' | translate }}
    </p>

    <p *ngIf="attemptedPath" class="mt-5 inline-flex max-w-full items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-4 py-2 text-[11px] font-bold text-slate-500">
      <span class="uppercase tracking-[0.18em] text-slate-400">{{ 'NOT_FOUND.PATH_LABEL' | translate }}</span>
      <code class="truncate font-mono text-slate-700" dir="ltr">/{{ attemptedPath }}</code>
    </p>

    <div class="mt-8 flex flex-col items-stretch justify-center gap-3 sm:flex-row sm:items-center">
      <a routerLink="/dashboard"
         class="rounded-xl bg-zadna-primary px-6 py-3 text-sm font-bold tracking-wide text-white shadow-[0_8px_20px_rgba(18,124,140,0.3)] transition hover:opacity-90">
        {{ 'NOT_FOUND.GO_DASHBOARD' | translate }}
      </a>
      <button type="button" (click)="goBack()"
         class="rounded-xl border-2 border-zadna-primary/20 bg-white px-6 py-3 text-sm font-bold tracking-wide text-zadna-primary transition hover:bg-zadna-primary/5">
        {{ 'NOT_FOUND.GO_BACK' | translate }}
      </button>
    </div>
  </div>
</div>
