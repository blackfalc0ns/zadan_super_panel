<div
    class="min-h-screen bg-slate-50/50 relative overflow-x-hidden selection:bg-zadna-primary/10 selection:text-zadna-primary flex">
    
    <!-- Ambient Background Art - Design 2.0 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <!-- Teal/Mint Glow top-left -->
        <div class="absolute -top-[20%] -start-[10%] w-[60%] h-[60%] bg-[radial-gradient(circle_at_center,_rgba(18,124,140,0.08)_0%,_transparent_70%)] blur-[100px] animate-pulse-slow"></div>
        <!-- Orange/Gold Glow bottom-right -->
        <div class="absolute -bottom-[10%] -end-[5%] w-[50%] h-[50%] bg-[radial-gradient(circle_at_center,_rgba(228,130,21,0.04)_0%,_transparent_70%)] blur-[80px] animate-pulse-slow delay-700"></div>
    </div>

    <!-- Component-Based Layout Architecture -->
    <div (click)="isSidebarOpen = false"
        class="fixed inset-0 bg-zadna-bgDark/20 backdrop-blur-sm z-40 transition-opacity duration-500 lg:hidden"
        [class.opacity-100]="isSidebarOpen" [class.pointer-events-auto]="isSidebarOpen"
        [class.opacity-0]="!isSidebarOpen" [class.pointer-events-none]="!isSidebarOpen">
    </div>

    <!-- Sidebar with status sync -->
    <app-sidebar [currentLang]="currentLang"
        [isCollapsed]="isSidebarCollapsed"
        (toggleCollapse)="toggleSidebarCollapse()"
        class="fixed inset-y-0 start-0 z-50 transform transition-transform duration-500 lg:translate-x-0 lg:p-4 lg:pe-0"
        [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen && currentLang === 'en'"
        [class.translate-x-full]="!isSidebarOpen && currentLang === 'ar'">
        <!-- User Profile Integrated in Sidebar -->
        <app-user-profile (logout)="logout()" [isCollapsed]="isSidebarCollapsed">
        </app-user-profile>
    </app-sidebar>

    <!-- Main Content Prism Arena -->
    <main
        class="flex-1 flex flex-col h-screen px-4 sm:px-6 ltr:lg:pr-4 rtl:lg:pl-4 py-4 sm:py-5 lg:py-4 transition-all duration-500 ease-out relative z-10 w-full overflow-x-hidden overflow-y-auto"
        [ngClass]="isSidebarCollapsed ? 'ltr:lg:pl-[120px] rtl:lg:pr-[120px]' : 'ltr:lg:pl-[312px] rtl:lg:pr-[312px]'">

        <app-header class="z-50 block w-full" [currentLang]="currentLang" [isSidebarOpen]="isSidebarOpen" (languageSwitch)="switchLanguage()"
            (toggleSidebar)="toggleSidebar()" (toggleNotificationsPanel)="toggleNotificationsPanel()">
        </app-header>

        <!-- Dynamic Content Space -->
        <section class="flex-1 w-full min-h-0 max-w-full overflow-x-hidden overflow-y-visible">
            <router-outlet></router-outlet>
        </section>

        <!-- Floating Assistance Hub (Hidden on small screens or refined) -->
        <button
            class="fixed bottom-6 end-6 sm:bottom-10 sm:end-10 w-14 h-14 sm:w-20 sm:h-20 bg-zadna-bgDark text-white rounded-2xl sm:rounded-[1.5rem] shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all z-40 group border-2 sm:border-4 border-white/50 backdrop-blur-xl">
            <svg class="w-6 h-6 sm:w-8 sm:h-8 group-hover:rotate-12 transition-transform" fill="currentColor"
                viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
            </svg>
            <span
                class="absolute -top-1 end-1 w-5 h-5 sm:w-6 sm:h-6 bg-zadna-accent rounded-full border-2 border-white flex items-center justify-center text-[8px] sm:text-[10px] font-black animate-bounce shadow-lg">!</span>
        </button>
    </main>

    <!-- Toast Container for Global Notifications -->
    <app-toast-container></app-toast-container>

    <!-- Notification Dropdown Panel (outside main to avoid stacking context issues) -->
    <div *ngIf="isNotificationsPanelOpen"
        class="fixed inset-0 z-[9998]" (click)="closeNotificationsPanel()"></div>
    <div *ngIf="isNotificationsPanelOpen"
        class="fixed top-[4.5rem] end-4 sm:end-6 w-[min(24rem,calc(100vw-2rem))] rounded-2xl border border-slate-200 bg-white shadow-2xl z-[9999] overflow-hidden">
        <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-100">
            <div>
                <p class="text-[12px] font-black text-slate-900">{{ 'NOTIFICATIONS_CENTER.TITLE' | translate }}</p>
                <p class="text-[10px] font-bold text-slate-500">{{ 'NOTIFICATIONS_CENTER.UNREAD_COUNT' | translate:{ count: unreadNotificationCount } }}</p>
            </div>
            <button type="button" (click)="markAllNotificationsRead()"
                class="px-3 py-1.5 rounded-full bg-slate-100 text-[10px] font-black text-slate-700 hover:bg-slate-200 transition">
                {{ 'NOTIFICATIONS_CENTER.MARK_ALL_READ' | translate }}
            </button>
        </div>

        <div class="max-h-[24rem] overflow-y-auto">
            <button *ngFor="let notification of recentNotifications; trackBy: trackByNotificationId" type="button"
                (click)="openNotification(notification)"
                class="w-full text-start px-4 py-3 border-b border-slate-100 hover:bg-slate-50 transition flex gap-3">
                <span class="mt-1 h-2.5 w-2.5 rounded-full shrink-0"
                    [class.bg-zadna-accent]="!notification.isRead"
                    [class.bg-slate-200]="notification.isRead"></span>
                <span class="min-w-0 flex-1">
                    <span class="flex items-center gap-2 mb-1">
                        <span class="truncate text-[12px] font-black text-slate-900">{{ displayNotificationTitle(notification) }}</span>
                        <span class="shrink-0 rounded-full border px-2 py-0.5 text-[9px] font-black uppercase"
                            [ngClass]="notificationPriorityClasses(notification.priority)">
                            {{ notificationPriorityLabel(notification.priority) }}
                        </span>
                    </span>
                    <span class="line-clamp-2 text-[11px] font-semibold text-slate-500">{{ displayNotificationBody(notification) }}</span>
                </span>
            </button>

            <div *ngIf="recentNotifications.length === 0" class="px-4 py-8 text-center">
                <p class="text-[12px] font-black text-slate-700">{{ 'NOTIFICATIONS_CENTER.EMPTY_TITLE' | translate }}</p>
            </div>
        </div>

        <button type="button" (click)="openNotificationCenter()"
            class="w-full px-4 py-3 bg-slate-50 text-[11px] font-black text-zadna-primary hover:bg-zadna-primary/5 transition">
            {{ 'NOTIFICATIONS_CENTER.OPEN_CENTER' | translate }}
        </button>
    </div>
</div>
