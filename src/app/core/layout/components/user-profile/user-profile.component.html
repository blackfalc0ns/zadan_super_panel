<div class="p-4 stagger-7" [ngClass]="isCollapsed ? 'px-1 py-3' : 'p-4'">
  <div
    routerLink="/profile"
    class="relative group/profile overflow-hidden cursor-pointer transition-all duration-500 hover:-translate-y-0.5 flex flex-col border"
    [ngClass]="isCollapsed
      ? 'items-center justify-center p-2 rounded-2xl bg-slate-950/45 border-white/[0.05] shadow-[0_12px_30px_rgba(0,0,0,0.25)]'
      : 'p-4 rounded-[1.6rem] bg-slate-950/40 border-white/[0.08] shadow-[0_20px_50px_rgba(0,0,0,0.28)] hover:border-white/[0.16]'">

    <div class="absolute inset-0 bg-gradient-to-br from-zadna-accent/10 via-zadna-primary/5 to-transparent opacity-0 group-hover/profile:opacity-100 transition-opacity duration-500"></div>
    <div class="absolute -top-10 -end-8 h-24 w-24 rounded-full bg-zadna-primary/10 blur-2xl opacity-0 group-hover/profile:opacity-100 transition-opacity duration-700"></div>

    <div
      class="relative z-10 flex items-center transition-all duration-500 w-full"
      [class.mb-4]="!isCollapsed"
      [class.justify-center]="isCollapsed"
      [ngClass]="isCollapsed ? 'gap-0' : 'gap-3.5'">
      <div class="relative shrink-0">
        <div
          class="relative overflow-hidden border border-white/15 shadow-[inset_0_1px_0_rgba(255,255,255,0.08)] transition-all duration-500 group-hover/profile:scale-[1.03] flex items-center justify-center"
          [ngClass]="isCollapsed ? 'w-11 h-11 rounded-xl' : 'w-12 h-12 rounded-[1.15rem]'">
          <img
            *ngIf="profilePhotoUrl; else initialsAvatar"
            [src]="profilePhotoUrl"
            [alt]="displayName"
            class="h-full w-full object-cover" />
          <ng-template #initialsAvatar>
            <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-zadna-primary to-teal-700 text-white font-black tracking-tight"
              [ngClass]="isCollapsed ? 'text-[11px]' : 'text-[13px]'">
              {{ initials }}
            </div>
          </ng-template>
        </div>

        <span
          class="absolute flex h-3.5 w-3.5 transition-all duration-500"
          [ngClass]="isCollapsed ? '-bottom-1 -end-1' : '-bottom-0.5 -end-0.5'">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"
            [class.bg-amber-400]="isActionRequired"
            [class.bg-emerald-400]="!isActionRequired"></span>
          <span
            class="relative inline-flex rounded-full h-3.5 w-3.5 border-2 border-[#092c30]"
            [class.bg-amber-400]="isActionRequired"
            [class.bg-emerald-400]="!isActionRequired"
            [class.shadow-[0_0_8px_rgba(251,191,36,0.55)]]="isActionRequired"
            [class.shadow-[0_0_8px_rgba(52,211,153,0.55)]]="!isActionRequired"></span>
        </span>
      </div>

      <div *ngIf="!isCollapsed" class="flex-1 min-w-0 overflow-hidden">
        <p class="text-[13px] font-black text-white tracking-tight truncate leading-none mb-1.5 drop-shadow-md">
          {{ displayName }}
        </p>
        <p class="text-[10px] font-black uppercase tracking-[0.14em] truncate mb-1"
          [class.text-amber-300]="isActionRequired"
          [class.text-zadna-accent]="!isActionRequired">
          <ng-container *ngIf="roleLabelKey; else rawRole">{{ roleLabelKey | translate }}</ng-container>
          <ng-template #rawRole>{{ roleDisplayName }}</ng-template>
        </p>
        <p *ngIf="contactLine" class="text-[10px] font-semibold text-white/55 truncate" dir="ltr">
          {{ contactLine }}
        </p>
        <p class="text-[9px] font-bold text-white/35 uppercase tracking-[0.18em] mt-1">
          {{ 'SIDEBAR_EXTRA.USER_ID' | translate: { id: shortUserId } }}
        </p>
      </div>
    </div>

    <div
      class="relative z-10 flex transition-all duration-500 w-full"
      [ngClass]="isCollapsed ? 'flex-col gap-2 mt-2 items-center' : 'flex-row gap-2'">
      <button
        type="button"
        (click)="$event.stopPropagation(); onLogout()"
        [title]="'SIDEBAR.LOGOUT' | translate"
        class="flex items-center justify-center bg-red-500/10 text-red-300 border border-red-500/20 rounded-xl hover:bg-red-500 hover:text-white hover:border-red-500 hover:shadow-[0_0_20px_rgba(239,68,68,0.28)] transition-all duration-300 active:scale-95 group/logout"
        [ngClass]="isCollapsed ? 'w-10 h-10 p-0' : 'flex-1 gap-2 py-2.5 text-[11px] font-bold'">
        <svg
          class="w-3.5 h-3.5 group-hover/logout:-translate-x-1 ltr:group-hover/logout:-translate-x-1 rtl:group-hover/logout:translate-x-1 rtl:rotate-180 transition-transform"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7" />
        </svg>
        <span *ngIf="!isCollapsed">{{ 'SIDEBAR.LOGOUT' | translate }}</span>
      </button>

      <button
        type="button"
        routerLink="/profile"
        (click)="$event.stopPropagation()"
        [title]="'SIDEBAR_EXTRA.SETTINGS' | translate"
        class="flex items-center justify-center bg-white/5 border border-white/10 text-white/60 rounded-xl hover:bg-white/12 hover:text-white hover:border-white/20 transition-all duration-300 active:scale-95"
        [ngClass]="isCollapsed ? 'w-10 h-10 p-0' : 'w-11 h-11'">
        <svg class="w-4 h-4 transition-transform duration-700 hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </div>
</div>
