<!-- High-End Profile Module -->
<div class="p-4 stagger-7" [ngClass]="isCollapsed ? 'px-1 py-3' : 'p-4'">
    <div
        routerLink="/profile"
        class="shadow-[0_20px_50px_rgba(0,0,0,0.3)] rounded-[1.6rem] relative group/profile overflow-hidden cursor-pointer transition-all duration-500 hover:-translate-y-1 flex flex-col items-center justify-center border border-white/[0.06] hover:border-white/[0.15]"
        [ngClass]="isCollapsed ? 'p-2 bg-slate-950/40 rounded-2xl' : 'p-4 bg-slate-950/35'">
        
        <!-- Hover Gradient Spotlight -->
        <div
            class="absolute inset-0 bg-gradient-to-br from-zadna-accent/8 to-transparent opacity-0 group-hover/profile:opacity-100 transition-opacity duration-500">
        </div>

        <div class="flex items-center gap-3.5 relative z-10 transition-all duration-500" [class.mb-4]="!isCollapsed" [class.justify-center]="isCollapsed" [class.w-full]="isCollapsed">
            <div class="relative shrink-0">
                <div
                    class="bg-white/5 backdrop-blur-xl shadow-inner transition-all duration-500 group-hover/profile:scale-105 overflow-hidden border border-white/10 flex items-center justify-center"
                    [ngClass]="isCollapsed ? 'w-10 h-10 rounded-xl p-1.5' : 'w-12 h-12 rounded-[1.1rem] p-2'">
                    <img src="assets/images/شعار 2-20260305T104717Z-3-001/شعار 2/شفاف (4).png"
                        class="w-full h-full object-contain filter drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)]">
                </div>
                <!-- Premium Pulsing Status Dot -->
                <span class="absolute flex h-3.5 w-3.5 transition-all duration-500"
                    [ngClass]="isCollapsed ? '-bottom-1 -end-1' : '-bottom-0.5 -end-0.5'">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-zadna-accent opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-zadna-accent border-2 border-[#092c30] shadow-[0_0_8px_rgba(228,130,21,0.6)]"></span>
                </span>
            </div>
            
            <div *ngIf="!isCollapsed" class="flex-1 min-w-0 transition-all duration-500 overflow-hidden">
                <p class="text-[13px] font-black text-white tracking-tight truncate leading-none mb-1.5 drop-shadow-md">
                    {{ userName }}</p>
                <p class="text-[9.5px] font-bold text-zadna-accent uppercase tracking-widest opacity-90 truncate">
                    {{ 'SIDEBAR_EXTRA.USER_ROLE_ID' | translate }}</p>
            </div>
        </div>

        <div class="flex relative z-10 transition-all duration-500 w-full" [ngClass]="isCollapsed ? 'flex-col gap-2 mt-2 items-center' : 'flex-row gap-2'">
            <!-- Logout Button -->
            <button type="button" (click)="$event.stopPropagation(); onLogout()"
                [title]="'SIDEBAR.LOGOUT' | translate"
                class="flex items-center justify-center bg-red-500/10 text-red-300 border border-red-500/20 rounded-xl hover:bg-red-500 hover:text-white hover:border-red-500 hover:shadow-[0_0_20px_rgba(239,68,68,0.3)] transition-all duration-300 active:scale-95 group/logout"
                [ngClass]="isCollapsed ? 'w-10 h-10 p-0' : 'flex-1 gap-2 py-2.5 text-[11px] font-bold'">
                <svg class="w-3.5 h-3.5 group-hover/logout:-translate-x-1 ltr:group-hover/logout:-translate-x-1 rtl:group-hover/logout:translate-x-1 rtl:rotate-180 transition-transform"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M17 16l4-4m0 0l-4-4m4 4H7" />
                </svg>
                <span *ngIf="!isCollapsed">{{ 'SIDEBAR.LOGOUT' | translate }}</span>
            </button>
            
            <!-- Settings Button -->
            <button
                type="button"
                routerLink="/profile"
                (click)="$event.stopPropagation()"
                [title]="'Settings'"
                class="flex items-center justify-center bg-white/5 border border-white/10 text-white/60 rounded-xl hover:bg-white/15 hover:text-white hover:border-white/20 transition-all duration-300 active:scale-95"
                [ngClass]="isCollapsed ? 'w-10 h-10 p-0' : 'w-11 h-11'">
                <svg class="w-4 h-4 transition-transform duration-700 hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </div>
</div>
