<!-- High-End Profile Module -->
<div class="p-4 stagger-7" [ngClass]="isCollapsed ? 'px-2' : 'p-4'">
    <div
        routerLink="/profile"
        class="shadow-[0_15px_40px_rgba(0,0,0,0.4)] rounded-[1.5rem] relative group/profile overflow-hidden cursor-pointer transition-all duration-500 hover:-translate-y-1 flex flex-col items-center justify-center border border-white/10"
        [ngClass]="isCollapsed ? 'p-2 bg-[#0a0f1c] rounded-2xl' : 'p-4 bg-[#0a0f1c]'">
        <div
            class="absolute inset-0 bg-gradient-to-br from-zadna-accent/10 to-transparent opacity-0 group-hover/profile:opacity-100 transition-opacity duration-500">
        </div>

        <div class="flex items-center gap-4 relative z-10 transition-all duration-500" [class.mb-4]="!isCollapsed" [class.justify-center]="isCollapsed" [class.w-full]="isCollapsed">
            <div class="relative shrink-0">
                <div
                    class="bg-white/5 backdrop-blur-xl shadow-inner transition-all duration-500 group-hover/profile:scale-105 overflow-hidden border border-white/10 flex items-center justify-center"
                    [ngClass]="isCollapsed ? 'w-10 h-10 rounded-xl p-1.5' : 'w-14 h-14 rounded-[1.25rem] p-2.5'">
                    <img src="assets/images/شعار 2-20260305T104717Z-3-001/شعار 2/شفاف (4).png"
                        class="w-full h-full object-contain filter drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)]">
                </div>
                <span
                    class="absolute bg-zadna-accent border-[2.5px] border-[#0a0f1c] rounded-full shadow-[0_0_10px_rgba(228,130,21,0.5)] transition-all duration-500"
                    [ngClass]="isCollapsed ? '-bottom-1 -end-1 w-3.5 h-3.5 border-2' : '-bottom-0.5 -end-0.5 w-4 h-4 border-[2.5px]'"></span>
            </div>
            <div class="flex-1 min-w-0 transition-all duration-500 overflow-hidden" [class.max-w-0]="isCollapsed" [class.opacity-0]="isCollapsed" [class.max-w-[150px]]="!isCollapsed" [class.opacity-100]="!isCollapsed">
                <p class="text-[13px] font-black text-white tracking-tight truncate leading-none mb-1.5 drop-shadow-md">
                    {{ userName }}</p>
                <p class="text-[10px] font-bold text-zadna-accent uppercase tracking-widest opacity-90">
                    {{ 'SIDEBAR_EXTRA.USER_ROLE_ID' | translate }}</p>
            </div>
        </div>

        <div class="flex gap-2 relative z-10 transition-all duration-500 w-full overflow-hidden" [class.max-h-0]="isCollapsed" [class.opacity-0]="isCollapsed" [class.max-h-[60px]]="!isCollapsed" [class.opacity-100]="!isCollapsed">
            <button type="button" (click)="$event.stopPropagation(); onLogout()"
                class="flex-1 flex items-center justify-center gap-2 py-2.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl text-[11px] font-bold hover:bg-red-500 hover:text-white hover:border-red-500 hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-all active:scale-95 group/logout">
                <svg class="w-4 h-4 group-hover/logout:-translate-x-1 ltr:group-hover/logout:-translate-x-1 rtl:group-hover/logout:translate-x-1 rtl:rotate-180 transition-transform"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M17 16l4-4m0 0l-4-4m4 4H7" />
                </svg>
                {{ 'SIDEBAR.LOGOUT' | translate }}
            </button>
            <button
                type="button"
                (click)="$event.stopPropagation()"
                class="w-12 flex items-center justify-center bg-white/5 border border-white/10 text-white/60 rounded-xl hover:bg-white/20 hover:text-white transition-all active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </button>
        </div>
    </div>
</div>
