<header class="sticky top-4 sm:top-5 lg:top-3 z-30 mb-5 sm:mb-6 lg:mb-4 animate-puzzle-down">
    <div class="premium-glass-light rounded-2xl sm:rounded-[2.5rem] p-3 sm:p-4 lg:p-2.5 flex items-center justify-between shadow-[0_15px_40px_rgba(0,0,0,0.035)]">

        <div class="flex items-center gap-2 sm:gap-4 flex-1">
            <!-- Mobile Menu Toggle -->
            <button (click)="onToggleSidebar()"
                class="lg:hidden w-10 h-10 rounded-xl bg-zadna-primary text-white flex items-center justify-center active:scale-90 transition-all shadow-lg shadow-zadna-primary/20">
                <svg *ngIf="!isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg *ngIf="isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Command Center Search (Compacted) - Hidden on XS mobile -->
            <div class="relative group hidden sm:block max-w-[200px] sm:max-w-md w-full">
                <div class="absolute inset-y-0 start-4 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-zadna-bgDark/20 group-focus-within:text-zadna-primary transition-colors"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" [placeholder]="'SIDEBAR.SEARCH' | translate"
                    class="w-full ps-10 sm:ps-11 pe-4 sm:pe-6 py-2 sm:py-2.5 bg-zadna-bgLight/30 rounded-xl sm:rounded-[1.2rem] text-[10px] sm:text-xs font-bold outline-none placeholder-zadna-bgDark/20 text-zadna-bgDark border-2 border-transparent focus:border-zadna-primary/10 focus:bg-white transition-all">
                <div
                    class="absolute end-4 top-1/2 -translate-y-1/2 hidden md:flex gap-1 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity">
                    <span
                        class="px-1.5 py-0.5 bg-white border rounded text-[8px] font-black text-zadna-bgDark/40">⌘</span>
                    <span
                        class="px-1.5 py-0.5 bg-white border rounded text-[8px] font-black text-zadna-bgDark/40">K</span>
                </div>
            </div>
        </div>

        <!-- Strategic Actions -->        <div class="flex items-center gap-1.5 sm:gap-3">
            <!-- Sync/Reload Control (Hidden on very small screens) -->
            <button (click)="reload()"
                class="hidden sm:flex w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white border border-zadna-bgLight items-center justify-center text-zadna-bgDark/30 hover:text-zadna-primary hover:border-zadna-primary/20 transition-all active:scale-90 group/sync shadow-sm">
                <svg class="w-4 h-4 group-hover/sync:rotate-180 transition-transform duration-700" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
 
            <!-- Language Switcher Capsule (Shrinked) -->
            <button (click)="onLanguageSwitch()"
                class="flex items-center gap-2 px-3.5 h-10 bg-white border border-zadna-bgLight rounded-full hover:border-zadna-primary/20 transition-all active:scale-95 group/lang shadow-sm">
                <div class="w-5 h-5 rounded-full bg-zadna-primary/5 flex items-center justify-center text-zadna-primary">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
                    </svg>
                </div>
                <span class="text-[9px] font-black uppercase tracking-[0.2em] text-zadna-bgDark">{{ currentLang
                    === 'ar' ? 'EN' : 'AR' }}</span>
            </button>
 
            <!-- Notification Bell (Shrinked) -->
            <div class="relative">
                <button type="button" (click)="toggleNotifications()"
                    class="w-11 h-11 rounded-full bg-zadna-primary/5 hover:bg-zadna-primary/10 text-zadna-primary flex items-center justify-center transition-all active:scale-95 group/btn border border-zadna-primary/5">
                    <div class="relative">
                        <span *ngIf="unreadNotificationCount > 0"
                            class="absolute -top-2 -end-2 min-w-[20px] h-5 px-1.5 bg-zadna-accent border-2 border-white rounded-full inline-flex items-center justify-center text-[10px] font-black text-white">
                            {{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}
                        </span>
                        <svg class="w-5 h-5 group-hover/btn:rotate-12 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                    </div>
                </button>

                <div *ngIf="isNotificationsOpen"
                    class="absolute top-14 end-0 w-[min(24rem,calc(100vw-2rem))] rounded-2xl border border-slate-200 bg-white shadow-2xl z-50 overflow-hidden">
                    <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-100">
                        <div>
                            <p class="text-[12px] font-black text-slate-900">Notifications</p>
                            <p class="text-[10px] font-bold text-slate-500">{{ unreadNotificationCount }} unread</p>
                        </div>
                        <button type="button" (click)="markAllNotificationsRead()"
                            class="px-3 py-1.5 rounded-full bg-slate-100 text-[10px] font-black text-slate-700 hover:bg-slate-200 transition">
                            Mark all read
                        </button>
                    </div>

                    <div class="max-h-[24rem] overflow-y-auto">
                        <button *ngFor="let notification of notifications; trackBy: trackByNotificationId" type="button"
                            (click)="openNotification(notification)"
                            class="w-full text-start px-4 py-3 border-b border-slate-100 hover:bg-slate-50 transition flex gap-3">
                            <span class="mt-1 h-2.5 w-2.5 rounded-full shrink-0"
                                [class.bg-zadna-accent]="!notification.isRead"
                                [class.bg-slate-200]="notification.isRead"></span>
                            <span class="min-w-0 flex-1">
                                <span class="flex items-center gap-2 mb-1">
                                    <span class="truncate text-[12px] font-black text-slate-900">{{ displayTitle(notification) }}</span>
                                    <span class="shrink-0 rounded-full border px-2 py-0.5 text-[9px] font-black uppercase"
                                        [ngClass]="priorityClasses(notification.priority)">
                                        {{ notification.priority || 'normal' }}
                                    </span>
                                </span>
                                <span class="line-clamp-2 text-[11px] font-semibold text-slate-500">{{ displayBody(notification) }}</span>
                            </span>
                        </button>

                        <div *ngIf="notifications.length === 0" class="px-4 py-8 text-center">
                            <p class="text-[12px] font-black text-slate-700">No notifications yet</p>
                        </div>
                    </div>

                    <button type="button" (click)="openNotificationCenter()"
                        class="w-full px-4 py-3 bg-slate-50 text-[11px] font-black text-zadna-primary hover:bg-zadna-primary/5 transition">
                        Open notification center
                    </button>
                </div>
            </div>
 
            <!-- Live Ops Button (Shrinked) - Hidden on XS mobile -->
            <button
                class="hidden md:flex items-center gap-2 ps-1.5 pe-4 py-1.5 bg-zadna-primary rounded-full text-white shadow-xl shadow-zadna-primary/20 hover:brightness-110 hover:-translate-y-0.5 transition-all active:scale-95 group/live whitespace-nowrap">
                <div
                    class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover/live:bg-zadna-primary transition-colors">
                    <svg class="w-4 h-4 rtl:-scale-x-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </div>
                <span class="text-[10px] font-black tracking-[0.2em] uppercase">{{ 'SIDEBAR_EXTRA.LIVE_OPS' |
                    translate }}</span>
            </button>

        </div>
    </div>
</header>
